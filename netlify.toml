# ─────────────────────────────────────────────────────────────────
#  netlify.toml — Netlify deployment configuration
#  Tells Netlify to build and deploy from the frontend/ folder
# ─────────────────────────────────────────────────────────────────

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
